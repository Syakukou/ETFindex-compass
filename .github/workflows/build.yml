name: build

on:
  # 手动触发，用于平时验证打包是否还能过
  workflow_dispatch:
  # 打 tag 时自动出包并挂到 Release
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------- Windows ----------------
  windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: 校验版本号
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re
          s = open('brand.py', encoding='utf-8').read()
          v = re.search(r'VERSION\s*=\s*.?(v[0-9.]+).', s).group(1)
          tag = os.environ['TAG']
          print('tag=%s version=%s' % (tag, v))
          raise SystemExit(0 if v == tag else 1)
          PY

      - name: 安装依赖
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 打包
        shell: bash
        run: |
          pyinstaller --noconfirm IndexCompass.spec
          cp LICENSE THIRD_PARTY_LICENSES.txt dist/IndexCompass/
          du -sh dist/IndexCompass

      - name: 压缩
        shell: pwsh
        run: |
          Compress-Archive -Path dist/IndexCompass -DestinationPath IndexCompass-windows.zip -CompressionLevel Optimal

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: IndexCompass-windows
          path: IndexCompass-windows.zip
          retention-days: 14

  # ---------------- macOS ----------------
  # 必须真机(macOS runner)构建: PyInstaller 不能交叉编译, Windows 上打不出 Mach-O
  macos:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest      # Apple Silicon (arm64)
            arch: arm64
          - runner: macos-15-intel    # Intel (x86_64), 新版 runner 已不再提供 Intel
            arch: x86_64
    # Intel runner 供给不稳定, 挂了不该拖累 arm64 发版
    continue-on-error: ${{ matrix.arch == 'x86_64' }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: 校验版本号
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python -c "
          import os,re
          s=open('brand.py',encoding='utf-8').read()
          v=re.search(r'VERSION\s*=\s*.?(v[0-9.]+).',s).group(1)
          print('tag=%s version=%s'%(os.environ['TAG'],v))
          raise SystemExit(0 if v==os.environ['TAG'] else 1)
          "

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # PyInstaller 在 macOS 上要求 .icns, 现有素材只有 png/ico, 用系统工具转一份
      - name: 生成 icns
        run: |
          set -e
          SRC=icons/icon_a.png
          mkdir -p build/icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s "$SRC" --out build/icon.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s * 2))
            sips -z $d $d "$SRC" --out build/icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns build/icon.iconset -o icons/icon_a.icns
          ls -l icons/icon_a.icns

      # 字体是 mac 版最容易翻车的地方: 名字对不上不报错, 只是满屏方块。
      # 这里把 matplotlib 实际认到的中文字体和 app_env 期望的列表对一次账。
      - name: 自检 - 字体与导入链
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          import matplotlib
          matplotlib.use("Agg")
          import matplotlib.font_manager as fm
          import app_env
          names = {f.name for f in fm.fontManager.ttflist}
          miss = [f for f in app_env.CJK_FONTS if f not in names]
          print("platform:", app_env.CJK_FONTS)
          print("matched  :", [f for f in app_env.CJK_FONTS if f in names])
          import etf_pro          # 导入链能过, 说明没有 Windows 专属依赖
          print("import etf_pro: ok")
          raise SystemExit(1 if len(miss) == len(app_env.CJK_FONTS) else 0)
          PY

      - name: 打包
        run: |
          pyinstaller --noconfirm IndexCompass.spec
          cp LICENSE THIRD_PARTY_LICENSES.txt dist/IndexCompass.app/Contents/Resources/ || true
          ls -la dist/
          du -sh dist/IndexCompass.app

      # 打包后再跑一次冒烟: offscreen 起窗口, 确认 Qt 插件与 matplotlib 后端都能加载
      - name: 自检 - 启动冒烟
        env:
          QT_QPA_PLATFORM: offscreen
          ETF_PUBLISH: '1'
        run: |
          python - <<'PY'
          from PySide6.QtWidgets import QApplication
          app = QApplication([])
          import etf_pro
          app.setStyleSheet(etf_pro.QSS)   # 样式表里的字体链能被解析
          print("QSS ok")
          print("style:", app.style().name())
          PY

      # .app 里有符号链接, 普通 zip 会把它压成实体文件甚至断链, 必须用 ditto
      - name: 压缩
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/IndexCompass.app IndexCompass-macos-${{ matrix.arch }}.zip
          ls -lh IndexCompass-macos-${{ matrix.arch }}.zip

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: IndexCompass-macos-${{ matrix.arch }}
          path: IndexCompass-macos-${{ matrix.arch }}.zip
          retention-days: 14

  # ---------------- 汇总发版 ----------------
  release:
    needs: [windows, macos]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: 取回全部产物
        uses: actions/download-artifact@v7
        with:
          path: assets
          merge-multiple: true

      - name: 检查产物清单
        run: ls -lh assets/

      - name: 发布到 Release
        uses: softprops/action-gh-release@v3
        with:
          files: assets/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## 下载

            | 系统 | 文件 | 说明 |
            | --- | --- | --- |
            | Windows 10/11 | `IndexCompass-windows.zip` | 解压后双击 `IndexCompass.exe` |
            | macOS Apple 芯片 (M1 及以后) | `IndexCompass-macos-arm64.zip` | 解压得到 `IndexCompass.app`，拖进「应用程序」 |
            | macOS Intel | `IndexCompass-macos-x86_64.zip` | 同上，适用于 2020 年前的 Intel 机型 |

            ## macOS 首次打开被拦下

            安装包没有做苹果开发者签名（需要付费证书），首次双击会提示无法验证开发者。三种处理方式任选一种：

            1. 右键点 `IndexCompass.app` → 选「打开」→ 弹窗里再点「打开」，之后正常双击即可。
            2. 系统设置 → 隐私与安全性 → 页面下方点「仍要打开」。
            3. 终端执行一次：`xattr -dr com.apple.quarantine /Applications/IndexCompass.app`

            数据存放在 `~/Library/Application Support/IndexCompass/`，卸载时一并删除即可清干净。
