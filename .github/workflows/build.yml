name: build-windows

on:
  # 手动触发，用于平时验证打包是否还能过
  workflow_dispatch:
  # 打 tag 时自动出包并挂到 Release
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 打包
        shell: pwsh
        run: |
          pyinstaller --noconfirm IndexCompass.spec
          # 许可与第三方声明随产物一起分发
          Copy-Item LICENSE, THIRD_PARTY_LICENSES.txt -Destination dist/IndexCompass/
          Write-Host "产物大小:"
          "{0:N1} MB" -f ((Get-ChildItem dist/IndexCompass -Recurse | Measure-Object Length -Sum).Sum / 1MB)

      - name: 压缩
        shell: pwsh
        run: |
          Compress-Archive -Path dist/IndexCompass -DestinationPath IndexCompass-windows.zip -CompressionLevel Optimal

      - name: 上传临时产物
        uses: actions/upload-artifact@v6
        with:
          name: IndexCompass-windows
          path: IndexCompass-windows.zip
          retention-days: 14

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: IndexCompass-windows.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
